# nginx site for Sajada: /etc/nginx/sites-available/sajada (symlink it into sites-enabled).
# On a separate gateway, point proxy_pass at the app server's APP_BIND:APP_PORT instead.
# `certbot --nginx -d sajada.devoutsys.com` then adds HTTPS and the http->https redirect.
# The app itself asks for the password (SAJADA_WEB_PASSWORD) and checks the Host header,
# so keep proxy_set_header Host as below.
server {
    listen 80;
    listen [::]:80;
    server_name sajada.devoutsys.com;

    # Backup restore uploads a JSON file.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
