# Local development only. Passwords come from services/.env (git-ignored; `pnpm db:setup` creates it).
# `docker compose up -d --build` runs PostgreSQL, the app role setup and the app on http://127.0.0.1:3000.
# ClickHouse is in the "analytics" profile: `docker compose --profile analytics up -d`.
services:
  postgres:
    # Schema and migrations are baked in by docker/db.Dockerfile (also published to GHCR).
    build: { context: .., dockerfile: docker/db.Dockerfile }
    environment:
      POSTGRES_DB: sajada
      POSTGRES_USER: sajada_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    # Over TCP: during first-start migrations PostgreSQL only listens on its socket.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sajada_owner -d sajada"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
  # Creates/updates the non-owner role the app connects as (also for an existing data volume).
  db-setup:
    build: { context: .., dockerfile: docker/db.Dockerfile }
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${SAJADA_API_PASSWORD:?Set SAJADA_API_PASSWORD}
    command: ["sh", "-c", "psql -h postgres -U sajada_owner -d sajada -v ON_ERROR_STOP=1 -q -v pw=\"$$APP_DB_PASSWORD\" -f /sajada/app-role.sql"]
  # Web + /v1 API on http://127.0.0.1:3000; sign in with the admin from services/.env.
  app:
    build: ..
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://sajada_api:${SAJADA_API_PASSWORD}@postgres:5432/sajada
      SAJADA_ADMIN_USERNAME: ${SAJADA_ADMIN_USERNAME:-admin}
      SAJADA_ADMIN_PASSWORD: ${SAJADA_ADMIN_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:8085/realms/sajada}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://127.0.0.1:8085/realms/sajada/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-sajada-api}
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_USER: sajada_analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - chdata:/var/lib/clickhouse
      - ./analytics/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  pgdata:
  chdata:
