# Local development only. Passwords come from services/.env (git-ignored; `pnpm db:setup` creates it).
# `docker compose up -d --build` runs PostgreSQL, the app role setup and the app on http://127.0.0.1:3000.
# ClickHouse is in the "analytics" profile: `docker compose --profile analytics up -d`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sajada
      POSTGRES_USER: sajada_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sajada_owner -d sajada"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../architecture/postgresql.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./transaction/hardening.sql:/docker-entrypoint-initdb.d/02-hardening.sql:ro
      - ./transaction/member-number.sql:/docker-entrypoint-initdb.d/03-member-number.sql:ro
      - ./transaction/profit-sharing.sql:/docker-entrypoint-initdb.d/04-profit-sharing.sql:ro
      - ./transaction/profit-corrections.sql:/docker-entrypoint-initdb.d/05-profit-corrections.sql:ro
      - ./transaction/profit-approval.sql:/docker-entrypoint-initdb.d/06-profit-approval.sql:ro
      - ./transaction/capital-wallet-refund.sql:/docker-entrypoint-initdb.d/20-capital-wallet-refund.sql:ro
      - ./transaction/web-workspace.sql:/docker-entrypoint-initdb.d/21-web-workspace.sql:ro
      - ./transaction/web-sections.sql:/docker-entrypoint-initdb.d/22-web-sections.sql:ro
      - ./transaction/web-maintenance.sql:/docker-entrypoint-initdb.d/23-web-maintenance.sql:ro
      - ./transaction/capital-wallet.sql:/docker-entrypoint-initdb.d/19-capital-wallet.sql:ro
      - ./transaction/po-replacement-reversal.sql:/docker-entrypoint-initdb.d/18-po-replacement-reversal.sql:ro
      - ./transaction/po-replacement.sql:/docker-entrypoint-initdb.d/17-po-replacement.sql:ro
      - ./transaction/po-inspection.sql:/docker-entrypoint-initdb.d/16-po-inspection.sql:ro
      - ./transaction/po-confirmation.sql:/docker-entrypoint-initdb.d/15-po-confirmation.sql:ro
      - ./transaction/po-delivery.sql:/docker-entrypoint-initdb.d/14-po-delivery.sql:ro
      - ./transaction/suppliers.sql:/docker-entrypoint-initdb.d/13-suppliers.sql:ro
      - ./transaction/payables.sql:/docker-entrypoint-initdb.d/12-payables.sql:ro
      - ./transaction/replenishment.sql:/docker-entrypoint-initdb.d/11-replenishment.sql:ro
      - ./transaction/order-receipt.sql:/docker-entrypoint-initdb.d/10-order-receipt.sql:ro
      - ./transaction/order-dispatch.sql:/docker-entrypoint-initdb.d/09-order-dispatch.sql:ro
      - ./transaction/order-cancel.sql:/docker-entrypoint-initdb.d/08-order-cancel.sql:ro
      - ./transaction/inventory.sql:/docker-entrypoint-initdb.d/07-inventory.sql:ro
  # Creates/updates the non-owner role the app connects as (also for an existing data volume).
  db-setup:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${SAJADA_API_PASSWORD:?Set SAJADA_API_PASSWORD}
    volumes:
      - ./local-dev-role.sql:/local-dev-role.sql:ro
    command: ["sh", "-c", "psql -h postgres -U sajada_owner -d sajada -v ON_ERROR_STOP=1 -q -v pw=\"$$APP_DB_PASSWORD\" -f /local-dev-role.sql"]
  # Web + /v1 API. No sign-in yet: reachable only from this computer (127.0.0.1).
  app:
    build: ..
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://sajada_api:${SAJADA_API_PASSWORD}@postgres:5432/sajada
      SAJADA_LOCAL_MODE: "1"
      OIDC_ISSUER: ${OIDC_ISSUER:-http://127.0.0.1:8085/realms/sajada}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-http://127.0.0.1:8085/realms/sajada/protocol/openid-connect/certs}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-sajada-api}
    ports: ["127.0.0.1:${APP_PORT:-3000}:3000"]
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_USER: sajada_analytics
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["127.0.0.1:8123:8123"]
    volumes:
      - chdata:/var/lib/clickhouse
      - ./analytics/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  pgdata:
  chdata:
